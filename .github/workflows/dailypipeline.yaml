name: DailyPipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
  FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Run full test suite (live data sources)
        run: uv run pytest
