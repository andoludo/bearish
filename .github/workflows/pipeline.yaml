name: Pipeline

on:
  push:

jobs:
  linting:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/') && ! contains(github.event.head_commit.message, 'Auto-increment')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Run ruff
        run: uv run ruff check

      - name: Run mypy
        run: uv run mypy

  tests:
    needs: [linting]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Run tests (offline, deterministic)
        run: uv run pytest -m "not network and not lfs"

  create-revision-and-tag:
    if: startsWith(github.ref, 'refs/heads/master')
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Determine Versioning Strategy
        run: |
          echo "Bumping minor version"
          uv version --bump minor
          echo "NEW_VERSION=$(uv version --short)" >> $GITHUB_ENV

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ github.ref == 'refs/heads/master' && 'Auto-increment release version' || 'Auto-increment prerelease version' }}

      - name: Create and Push Git Tag
        run: |
          NEW_TAG="${{ env.NEW_VERSION }}"
          git tag $NEW_TAG
          git push origin $NEW_TAG
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # The default GITHUB_TOKEN is read-only unless the job asks for more:
    # creating the GitHub release needs contents: write. Every tagged build
    # since 0.50.0 failed here with "Resource not accessible by integration",
    # which also skipped the PyPI upload.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Determine Current Version
        run: |
          echo "NEW_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Build source and wheel archives
        id: build
        run: uv build

      - name: Get Commit Messages Since Last Tag
        id: commit_messages
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            RELEASE_NOTES=$(git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %s")
          else
            RELEASE_NOTES=$(git log -20 --pretty=format:"- %s")
          fi
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: List generated files
        run: ls -l dist

      - name: Upload Wheel to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_VERSION }}
          name: Release ${{ env.NEW_VERSION }}
          body: |
            ## Release Notes
            - Automatically generated release for version **${{ env.NEW_VERSION }}**
            - Commit: ${{ github.sha }}
            - Triggered by push to branch `${{ github.ref_name }}`

          files: dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish distribution 📦 to PyPI
        if: "contains(github.event.head_commit.message, 'Auto-increment release version')"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          repository_url: https://upload.pypi.org/legacy/
