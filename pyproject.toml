[project]
name = "bearishpy"
version = "0.51.0"
description = "Query financial and price data from various sources and persist it into a well-structured SQLite database for further analysis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "aan", email = "andoludovic.andriamamonjy@gmail.com" }]
dependencies = [
    "pandas>=2.1.4,<4",
    "pydantic>=2.5.3,<3",
    "alembic>=1.14.0,<2",
    "sqlmodel>=0.0.22,<0.1",
    "python-dotenv>=1.0.1,<2",
    "yfinance>=0.2.66,<2",
    "typer>=0.13.1,<1",
    "tenacity>=9.0.0,<10",
    "numpy>=2.2,<3",
    "yahooquery>=2.4.1,<3",
    "sec-edgar-downloader>=5.0.3,<6",
    "sec-cik-mapper>=2.1.0,<3",
    "requests>=2.31",
    "rich>=13",
    "setuptools>=78.1.0",
    "html5lib>=1.1,<2",
]

[project.scripts]
bearish = "bearish.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bearish"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.4",
    "mypy>=1.8.0,<2",
    "ruff",
    "requests-mock>=1.12.1",
    "pandas-stubs>=2.2.0.240218",
    "types-simplejson>=3.19.0.20240218",
    "types-beautifulsoup4>=4.12.0.20240229",
    "time-machine>=3.5.1",
]

[tool.mypy]
plugins = "pydantic.mypy"
packages = "bearish"

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
show_absolute_path = true
disallow_untyped_defs = true
strict = true

exclude = [
    "test_*",
    "conftest.py",
    "bearish/database/alembic/",
]

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "test_*",
    "conftest.py",
    "bearish/database/alembic/*",
]

[tool.ruff.lint]
select = ["E", "W", "F", "B006", "RUF", "UP", "SIM", "FURB", "PIE", "PERF", "C4", "B", "PL", "S", "C901", "N", "ANN", "ERA001", "PD"]
# UP006/UP035/UP007/UP045/UP042 are typing-modernisation rules; the codebase
# deliberately keeps the explicit typing.Optional/List/Union spelling.
# PLC0415 flags the intentional lazy imports used to avoid import cycles.
extend-ignore = [
    "UP006", "UP035", "UP007", "UP045", "UP042",
    "S608", "W291", "ANN401", "N801",
    "PLC0415", "FURB110",
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S101", "F401", "RUF100", "ANN", "PLR"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require outbound network access to live data providers",
    "lfs: tests that require the git-lfs test database (tests/data/bear.db)",
]
