[project]
name = "bearishpy"
version = "0.50.0"
description = "Fetch financial data from various sources, normalise it into a common data model, and persist it in SQLite for offline analysis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "aan", email = "andoludovic.andriamamonjy@gmail.com" }]
dependencies = [
    "pydantic>=2.5",
    "typer>=0.13",
    "yfinance>=0.2",
]

[project.scripts]
bearish = "bearish.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "mypy>=1.8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bearish"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4",
    "mypy>=1.8",
    "ruff",
    "pandas>=2",
]

[tool.mypy]
plugins = "pydantic.mypy"
packages = "bearish"
strict = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["yfinance"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP", "SIM", "C4", "N", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"bearish/cli.py" = ["B008"]  # typer's idiomatic Option/Argument as defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
